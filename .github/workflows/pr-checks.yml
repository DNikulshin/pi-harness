name: PR checks

# Связь PR с issue: в теле должна быть строка `Closes #<номер>`.
#
# Зачем: GitHub связывает issue в момент мержа по ключевому слову в теле PR. Если тело собрано из
# шаблона (`Closes #` без номера) или пересказано словами, issue остаётся открытым, а доска
# показывает прежнюю колонку. Проверка делает это состояние невозможным: без ссылки обязательный
# чек не пройдёт.
#
# HTML-комментарии, блоки кода и строки в обратных кавычках не считаются ссылками: подсказка
# шаблона «Closes #<номер>» иначе проходила бы проверку, ничего не закрывая. Inline-code важен
# отдельно: GitHub внутри `Closes #4` ключевое слово не распознаёт, и проверка, которая его
# засчитывала, зеленела бы ровно там, где issue останется открытым (так вышло с #4).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-references:
    # PR от Dependabot не ссылаются на issue: задачи в трекере у бота нет, тело он не правит.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Логика — tooling/pr-reference.mjs (чистые функции, покрыты node --test): HTML-комментарии,
      # блоки кода и inline-code не считаются ссылками, иначе подсказка шаблона «Closes #<номер>»
      # и пример в кавычках проходили бы проверку, ничего не закрывая.
      - name: Ссылка на issue в теле PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tooling/pr-reference.mjs
